name: WeedAuthority
options:
  bundleIdPrefix: co.eb28
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "6"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.2.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  WeedAuthority:
    type: application
    platform: iOS
    sources:
      - path: WeedAuthority
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weedauthority.weedauthority
        PRODUCT_NAME: WeedAuthority
        INFOPLIST_FILE: WeedAuthority/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WN3K69XEP4
        WEEDAUTHORITY_GAD_APPLICATION_IDENTIFIER: ca-app-pub-3940256099942544~1458002511
        WEEDAUTHORITY_GAD_BANNER_AD_UNIT_ID: ca-app-pub-3940256099942544/2435281174
      configs:
        Release:
          WEEDAUTHORITY_GAD_APPLICATION_IDENTIFIER: ca-app-pub-9665484869013517~1395548152
          WEEDAUTHORITY_GAD_BANNER_AD_UNIT_ID: ca-app-pub-9665484869013517/7769384812
    info:
      path: WeedAuthority/Info.plist
      properties:
        CFBundleDisplayName: WEED AUTHORITY
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GADApplicationIdentifier: "$(WEEDAUTHORITY_GAD_APPLICATION_IDENTIFIER)"
        WEEDAUTHORITY_GAD_BANNER_AD_UNIT_ID: "$(WEEDAUTHORITY_GAD_BANNER_AD_UNIT_ID)"
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Weed Authority can use Face ID to quickly unlock your private local rec profile."
        NSLocationWhenInUseUsageDescription: "Weed Authority uses your location to confirm you are in a U.S. state with a supported legal cannabis program before showing retailer and deal content."
