name: EB28 Social Connection Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'

permissions:
  contents: read

concurrency:
  group: eb28-social-connection-audit
  cancel-in-progress: false

jobs:
  verify-buffer-connections:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify EB28 Buffer account and channels without mutation
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          EB28_BUFFER_EXPECTED_ACCOUNT_EMAIL: social@eb28.co
          EB28_BUFFER_ORGANIZATION_ID: ${{ secrets.EB28_BUFFER_ORGANIZATION_ID }}
          EB28_BUFFER_CHANNELS: ${{ secrets.EB28_BUFFER_CHANNELS }}
          EB28_BUFFER_PLATFORM_ALLOWLIST: ${{ secrets.EB28_BUFFER_PLATFORM_ALLOWLIST }}
          EB28_SOCIAL_POSTING_ENABLED: ${{ secrets.EB28_SOCIAL_POSTING_ENABLED }}
        run: |
          set -euo pipefail
          mkdir -p output/verification
          node scripts/publish-eb28-buffer.mjs --verify 2>&1 | tee output/verification/eb28-social-connection-audit.log

      - name: Preserve connection audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eb28-social-connection-audit
          path: output/verification/eb28-social-connection-audit.log
          if-no-files-found: warn
          retention-days: 30
